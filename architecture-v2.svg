<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="cfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F38020"/>
      <stop offset="100%" stop-color="#FAA761"/>
    </linearGradient>
    <linearGradient id="azIntGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#103050"/>
      <stop offset="100%" stop-color="#2B6A9E"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F38020"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2EA043"/>
    </marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#103050"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">Supreme Counselling — v2 Infrastructure Architecture</text>
  <text x="600" y="55" text-anchor="middle" font-size="12" fill="#666">Cloudflare-Native Public + Azure VNet-Isolated Internal — Region: US East</text>

  <!-- ============================================================ -->
  <!-- LAYER 1: CLOUDFLARE (Public-Facing) -->
  <!-- ============================================================ -->
  <rect x="30" y="70" width="1140" height="380" rx="12" fill="url(#cfGrad)" opacity="0.08"/>
  <rect x="30" y="70" width="1140" height="380" rx="12" fill="none" stroke="#F38020" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="50" y="92" font-size="14" font-weight="700" fill="#F38020">☁  CLOUDFLARE — Public-Facing (All-inclusive, Free Plan)</text>

  <!-- Edge services row -->
  <rect x="55" y="105" width="170" height="60" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadowLight)"/>
  <text x="140" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#333">DNS</text>
  <text x="140" y="148" text-anchor="middle" font-size="10" fill="#666">Proxied records</text>

  <rect x="240" y="105" width="170" height="60" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadowLight)"/>
  <text x="325" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#333">WAF</text>
  <text x="325" y="148" text-anchor="middle" font-size="10" fill="#666">OWASP + Managed Rules</text>

  <rect x="425" y="105" width="170" height="60" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadowLight)"/>
  <text x="510" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#333">SSL / TLS</text>
  <text x="510" y="148" text-anchor="middle" font-size="10" fill="#666">Full Strict</text>

  <rect x="610" y="105" width="170" height="60" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadowLight)"/>
  <text x="695" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Rate Limiting</text>
  <text x="695" y="148" text-anchor="middle" font-size="10" fill="#666">10 req/min per device</text>

  <rect x="795" y="105" width="170" height="60" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadowLight)"/>
  <text x="880" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Security Headers</text>
  <text x="880" y="148" text-anchor="middle" font-size="10" fill="#666">HSTS, XFO, CSP, etc.</text>

  <!-- Down arrow to app layer -->
  <line x1="600" y1="165" x2="600" y2="190" stroke="#F38020" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Pages + Workers row -->
  <rect x="55" y="200" width="350" height="110" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadow)"/>
  <text x="230" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#F38020">Cloudflare Pages</text>
  <text x="230" y="240" text-anchor="middle" font-size="10" fill="#555">Static site hosting (Vite SPA)</text>
  <text x="230" y="258" text-anchor="middle" font-size="10" fill="#555">Pages Functions → API endpoints</text>
  <text x="230" y="276" text-anchor="middle" font-size="10" fill="#555">/api/contact, /api/booking, /api/chat</text>
  <text x="230" y="294" text-anchor="middle" font-size="9" fill="#888">Bindings: D1 · R2 · Workers AI</text>

  <rect x="430" y="200" width="240" height="110" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadow)"/>
  <text x="550" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#F38020">Workers AI</text>
  <text x="550" y="240" text-anchor="middle" font-size="10" fill="#555">Pay-per-token inference</text>
  <text x="550" y="258" text-anchor="middle" font-size="10" fill="#555">Llama, Mistral, etc.</text>
  <text x="550" y="276" text-anchor="middle" font-size="10" fill="#555">No server to manage</text>

  <rect x="695" y="200" width="240" height="110" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadow)"/>
  <text x="815" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#F38020">Workers (Edge Functions)</text>
  <text x="815" y="240" text-anchor="middle" font-size="10" fill="#555">RAG document retrieval</text>
  <text x="815" y="258" text-anchor="middle" font-size="10" fill="#555">Embedding generation</text>
  <text x="815" y="276" text-anchor="middle" font-size="10" fill="#555">Email notification proxy</text>

  <!-- Data services row -->
  <rect x="55" y="325" width="240" height="110" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadow)"/>
  <text x="175" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#F38020">D1 Database</text>
  <text x="175" y="366" text-anchor="middle" font-size="10" fill="#555">Serverless SQLite (5GB free)</text>
  <text x="175" y="384" text-anchor="middle" font-size="10" fill="#555">Bookings table</text>
  <text x="175" y="402" text-anchor="middle" font-size="9" fill="#888">name, email, phone, date, time</text>

  <rect x="320" y="325" width="240" height="110" rx="8" fill="#fff" stroke="#F38020" filter="url(#shadow)"/>
  <text x="440" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#F38020">R2 Storage</text>
  <text x="440" y="366" text-anchor="middle" font-size="10" fill="#555">S3-compatible object storage</text>
  <text x="440" y="384" text-anchor="middle" font-size="10" fill="#555">Public RAG documents (10GB free)</text>
  <text x="440" y="402" text-anchor="middle" font-size="10" fill="#555">Embedding vectors</text>

  <rect x="585" y="325" width="240" height="110" rx="8" fill="#fff" stroke="#ccc" filter="url(#shadowLight)" opacity="0.6"/>
  <text x="705" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#999">Azure Comm. Services</text>
  <text x="705" y="366" text-anchor="middle" font-size="10" fill="#bbb">Email via ACS</text>
  <text x="705" y="384" text-anchor="middle" font-size="10" fill="#bbb">Contact &amp; booking notifications</text>
  <text x="705" y="402" text-anchor="middle" font-size="10" fill="#bbb">Acknowledgement emails</text>
  <text x="590" y="333" font-size="10" font-weight="700" fill="#e00">✕ To be provisioned</text>

  <!-- Cost badge -->
  <rect x="870" y="325" width="285" height="60" rx="8" fill="#F38020" filter="url(#shadowLight)"/>
  <text x="1012" y="350" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">BBD $0–40 / mo</text>
  <text x="1012" y="370" text-anchor="middle" font-size="11" fill="#fff" opacity="0.9">Public side — near zero cost</text>

  <!-- ============================================================ -->
  <!-- Separator + arrow down -->
  <!-- ============================================================ -->
  <line x1="600" y1="450" x2="600" y2="480" stroke="#103050" stroke-width="2.5" marker-end="url(#arrowNavy)"/>

  <!-- ============================================================ -->
  <!-- LAYER 2: AZURE INTERNAL -->
  <!-- ============================================================ -->
  <rect x="30" y="490" width="1140" height="330" rx="12" fill="url(#azIntGrad)" opacity="0.06"/>
  <rect x="30" y="490" width="1140" height="330" rx="12" fill="none" stroke="#103050" stroke-width="2"/>
  <text x="50" y="512" font-size="14" font-weight="700" fill="#103050">☁  AZURE — Internal VNet-Isolated (Staff-Only Company Data)</text>

  <!-- VNet box -->
  <rect x="55" y="525" width="790" height="280" rx="10" fill="#103050" fill-opacity="0.04" stroke="#103050" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="75" y="545" font-size="12" font-weight="600" fill="#103050">Azure Virtual Network — 10.1.0.0/16</text>

  <!-- Internal ACA -->
  <rect x="75" y="558" width="480" height="120" rx="8" fill="#103050" fill-opacity="0.06" stroke="#103050" stroke-width="1"/>
  <text x="90" y="576" font-size="11" font-weight="600" fill="#103050">ACA Environment (VNet-injected, Consumption)</text>

  <rect x="90" y="588" width="210" height="78" rx="7" fill="#fff" stroke="#103050" filter="url(#shadowLight)"/>
  <text x="195" y="612" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Internal RAG App</text>
  <text x="195" y="630" text-anchor="middle" font-size="10" fill="#555">Company data query interface</text>
  <text x="195" y="646" text-anchor="middle" font-size="9" fill="#888">Mounted: Azure Files (docs)</text>

  <rect x="320" y="588" width="210" height="78" rx="7" fill="#fff" stroke="#103050" filter="url(#shadowLight)"/>
  <text x="425" y="612" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Ollama (Private)</text>
  <text x="425" y="630" text-anchor="middle" font-size="10" fill="#555">Company context inference</text>
  <text x="425" y="646" text-anchor="middle" font-size="9" fill="#888">Mounted: Azure Files (models)</text>

  <!-- Internal Storage -->
  <rect x="580" y="558" width="250" height="120" rx="8" fill="#103050" fill-opacity="0.06" stroke="#103050" stroke-width="1"/>
  <text x="595" y="576" font-size="11" font-weight="600" fill="#103050">Storage Account (Private)</text>

  <rect x="595" y="588" width="220" height="35" rx="6" fill="#fff" stroke="#103050" filter="url(#shadowLight)"/>
  <text x="705" y="606" text-anchor="middle" font-size="11" font-weight="600" fill="#333">Azure Files — Company docs</text>
  <text x="705" y="619" text-anchor="middle" font-size="9" fill="#888">100GB Standard SSD</text>

  <rect x="595" y="630" width="220" height="35" rx="6" fill="#fff" stroke="#103050" filter="url(#shadowLight)"/>
  <text x="705" y="648" text-anchor="middle" font-size="11" font-weight="600" fill="#333">Azure Files — Ollama models</text>
  <text x="705" y="661" text-anchor="middle" font-size="9" fill="#888">100GB Standard SSD</text>

  <!-- Private Endpoint badge -->
  <rect x="580" y="546" width="115" height="20" rx="4" fill="#2EA043" opacity="0.85"/>
  <text x="637" y="560" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">🔒 Private Endpoints</text>

  <!-- Internal arrows -->
  <path d="M 300 627 L 320 627" stroke="#103050" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <path d="M 530 627 L 595 627" stroke="#103050" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

  <!-- VPN Gateway row -->
  <rect x="75" y="693" width="480" height="95" rx="8" fill="#103050" fill-opacity="0.06" stroke="#103050" stroke-width="1"/>
  <text x="90" y="712" font-size="11" font-weight="600" fill="#103050">Access — Azure VPN Gateway (Point-to-Site)</text>

  <rect x="90" y="723" width="140" height="55" rx="7" fill="#fff" stroke="#103050" filter="url(#shadowLight)"/>
  <text x="160" y="748" text-anchor="middle" font-size="11" font-weight="700" fill="#333">VPN Gateway</text>
  <text x="160" y="763" text-anchor="middle" font-size="9" fill="#555">VpnGw1 — BBD $60/mo</text>

  <path d="M 230 750 L 270 750" stroke="#2EA043" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="280" y="723" width="140" height="55" rx="7" fill="#e6ffe6" stroke="#2EA043" filter="url(#shadowLight)"/>
  <text x="350" y="748" text-anchor="middle" font-size="11" font-weight="700" fill="#2EA043">👤 Staff Laptops</text>
  <text x="350" y="763" text-anchor="middle" font-size="9" fill="#555">OpenVPN / IKEv2</text>

  <!-- Note about Microsoft domain -->
  <rect x="580" y="693" width="285" height="95" rx="8" fill="#f0f4ff" stroke="#0078D4" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="722" y="715" text-anchor="middle" font-size="11" font-weight="700" fill="#0078D4">💡 Microsoft Integration</text>
  <text x="595" y="735" font-size="10" fill="#555">Uses existing Microsoft domain for:</text>
  <text x="595" y="752" font-size="10" fill="#555">• Azure AD authentication (VPN)</text>
  <text x="595" y="768" font-size="10" fill="#555">• Office 365 email integration</text>

  <!-- ============================================================ -->
  <!-- LEGEND -->
  <!-- ============================================================ -->
  <rect x="30" y="835" width="1140" height="40" rx="6" fill="#f8f9fa" stroke="#ddd"/>
  <text x="50" y="860" font-size="10" fill="#666">
    <tspan font-weight="700" fill="#F38020">■</tspan> Cloudflare (Public — BBD $0–40/mo)
    <tspan font-weight="700" fill="#103050">■</tspan> Azure (Internal — BBD $140–200/mo)
    <tspan font-weight="700" fill="#2EA043">■</tspan> Staff VPN Access
    <tspan font-weight="700" fill="#ccc">■</tspan> Not yet provisioned
  </text>
  <text x="50" y="875" font-size="9" fill="#999">Total estimated cost: BBD $140–240/mo | Cloudflare Free Plan | Region: US East</text>
  <text x="1050" y="860" font-size="9" fill="#999">Generated: June 2026</text>
</svg>
